[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-firewall"
version = "0.1.0"
description = "Defensive tool-permission firewall for AI agents: scoped capabilities, sandboxed execution, credential isolation, and a full audit trail between agents and their tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bala Sai Kunapareddi" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
live = ["litellm>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
agent-tool-firewall = "agent_tool_firewall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
